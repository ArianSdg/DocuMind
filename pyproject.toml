[project]
name = "documind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ArianSdg", email = "ariansadegh8305@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.13.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "."

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
